name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  userspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck sparse
      - name: Build and test userspace
        run: |
          make tools
          ./tests/run-tests.sh
          shellcheck install-dkms.sh uninstall-dkms.sh examples/sprd-cell-poll.sh tests/run-tests.sh
      - name: Sanitizer build
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined tools/sprd-at-tty.c \
            -o build/sprd-at-tty-sanitized
          ASAN_OPTIONS=detect_leaks=0 \
            SPRD_AT_CLIENT=build/sprd-at-tty-sanitized \
            python3 tests/test-at-client.py

  kernel:
    strategy:
      fail-fast: false
      matrix:
        branch: ["5.10", "5.15", "6.1", "6.6", "6.12", "mainline"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev sparse
      - name: Fetch kernel
        run: |
          if [ "${{ matrix.branch }}" = mainline ]; then
            git clone --depth 1 https://github.com/torvalds/linux.git kernel
          else
            git clone --depth 1 --branch "linux-${{ matrix.branch }}.y" \
              https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git kernel
          fi
      - name: Prepare kernel
        working-directory: kernel
        run: |
          make defconfig
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_USB
          scripts/config --enable CONFIG_USB_SERIAL
          make olddefconfig prepare modules_prepare
      - name: Build external module
        run: |
          make -C kernel M="$GITHUB_WORKSPACE" W=1 \
            KBUILD_MODPOST_WARN=1 modules
      - name: Sparse
        if: matrix.branch == 'mainline'
        run: |
          make -C kernel M="$GITHUB_WORKSPACE" clean
          make -C kernel M="$GITHUB_WORKSPACE" C=1 \
            KBUILD_MODPOST_WARN=1 modules
      - name: Check kernel style
        if: matrix.branch == 'mainline'
        run: kernel/scripts/checkpatch.pl --strict --no-tree -f sprd_vcom.c

  arm64:
    strategy:
      matrix:
        branch: ["5.10", "mainline"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex gcc-aarch64-linux-gnu libelf-dev
      - name: Fetch and prepare kernel
        run: |
          if [ "${{ matrix.branch }}" = mainline ]; then
            git clone --depth 1 https://github.com/torvalds/linux.git kernel
          else
            git clone --depth 1 --branch linux-5.10.y \
              https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git kernel
          fi
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            prepare modules_prepare
      - name: Cross-build external module
        run: |
          make -C kernel M="$GITHUB_WORKSPACE" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- W=1 \
            KBUILD_MODPOST_WARN=1 modules

  clang-mainline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison clang flex libelf-dev llvm
      - name: Fetch and prepare mainline
        run: |
          git clone --depth 1 https://github.com/torvalds/linux.git kernel
          make -C kernel LLVM=1 defconfig
          make -C kernel LLVM=1 prepare modules_prepare
      - name: Build external module with Clang
        run: |
          make -C kernel M="$GITHUB_WORKSPACE" LLVM=1 W=1 \
            KBUILD_MODPOST_WARN=1 modules
