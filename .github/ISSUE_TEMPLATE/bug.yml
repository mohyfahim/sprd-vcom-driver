name: Bug report
description: Report a regression or problem on supported hardware.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove IMEI, ICCID, IMSI, phone numbers, APNs, credentials, SMS content, and subscriber data from logs."
  - type: input
    id: version
    attributes:
      label: Driver version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Kernel and distribution
      placeholder: "Linux 6.12.x, Debian 13, x86_64"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and firmware
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Sanitized lsusb -t, dmesg, and driver bindings
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed subscriber identifiers, phone numbers, credentials, and private message content.
          required: true
